[workspace]
members = ["apps/foxcad"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"] }
winit = "=0.30.13"
wgpu = "30.0"
pollster = "0.4"
fox-graphics = { path = "../fox-graphics" }
